name: Release - Cloud Agent Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==================================================
  # 1. Simulated release
  # ==================================================
  release:
    runs-on: self-hosted

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          echo "========================================"
          echo "BUILD"
          echo "========================================"

          sleep 5

          echo "Build completed successfully."

      - name: Test
        run: |
          echo "========================================"
          echo "TEST"
          echo "========================================"

          sleep 5

          echo "All tests passed."

      - name: Deploy
        run: |
          echo "========================================"
          echo "DEPLOY"
          echo "========================================"

          sleep 5

          echo "Deployment completed successfully."

      - name: Release completed
        run: |
          echo "========================================"
          echo "RELEASE COMPLETED SUCCESSFULLY"
          echo "========================================"


  # ==================================================
  # 2. Start Copilot Cloud Agent
  # ==================================================
  trigger-release-verifier:
    needs: release
    runs-on: self-hosted

    steps:

      - name: Start release verification agent
        env:
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}

        run: |

          set -e

          echo "========================================"
          echo "Starting Copilot Cloud Agent"
          echo "========================================"

          API_URL="https://api.github.com/agents/repos/${GITHUB_REPOSITORY}/tasks"

          PROMPT="Verify release workflow run ${GITHUB_RUN_ID}.

          Repository: ${GITHUB_REPOSITORY}

          Workflow: Release - Cloud Agent Verification

          Run ID: ${GITHUB_RUN_ID}

          Commit: ${GITHUB_SHA}

          Run URL: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          The release workflow completed successfully.

          Inspect the workflow run and repository.

          Verify the build, tests, and deployment.

          Provide the Release Verification report defined by your custom agent."

          RESPONSE=$(curl -sS \
            -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${COPILOT_AGENT_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "${API_URL}" \
            -d "$(cat <<EOF
          {
            "prompt": $(printf '%s' "$PROMPT" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))'),
            "custom_agent": "release-verifier",
            "base_ref": "main",
            "create_pull_request": false
          }
          EOF
          )")

          echo "$RESPONSE"

          HTTP_STATUS=$(echo "$RESPONSE" | sed -n 's/HTTP_STATUS://p')

          echo ""
          echo "HTTP status: ${HTTP_STATUS}"

          if [ "$HTTP_STATUS" != "201" ]; then
            echo "ERROR: Failed to start Cloud Agent."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "Cloud Agent task started successfully!"
          echo "========================================"
