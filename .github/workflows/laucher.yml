name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:

  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          echo "Building release..."
          sleep 5

      - name: Test
        run: |
          echo "Running tests..."
          sleep 5

      - name: Deploy
        run: |
          echo "Deploying release..."
          sleep 5

      - name: Release completed
        run: echo "Release completed successfully"


  trigger-verification:
    needs: release
    runs-on: ubuntu-latest

    steps:

      - name: Create verification issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          ISSUE_URL=$(gh issue create \
            --title "Verify release ${{ github.run_number }}" \
            --body "Verify release workflow run ${{ github.run_id }}.")

          echo "Issue created: $ISSUE_URL"

          ISSUE_NUMBER="${ISSUE_URL##*/}"

          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"


      - name: Assign issue to release verifier agent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
        run: |

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/assignees" \
            --input - <<EOF
          {
            "assignees": ["copilot-swe-agent[bot]"],
            "agent_assignment": {
              "target_repo": "${{ github.repository }}",
              "base_branch": "main",
              "custom_instructions": "Verify the release associated with this workflow run.",
              "custom_agent": "release-verifier"
            }
          }
          EOF
